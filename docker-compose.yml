services:
  frontend:
    build: 
      context: ../frontend
    ports:
      - "${PORT_FE}:${PORT_FE}"
    restart: always
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment: 
      - PORT=${PORT}
      - DATABASE_HOST=postgresdb 
      - PG_USER=${PG_USER}  
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_NAME=${PG_NAME} 
      - PG_PORT=${PG_PORT}    
      - MONGO_URI=${MONGO_DOCKER_URI} 
      - MONGO_DB_NAME=${MONGO_DB_NAME} 
      - MONGO_PORT=${MONGO_PORT}
    depends_on:
      - postgres-db
      - mongo-db
    restart: always
  postgres-db:
    image: postgres:15
    container_name: postgresdb
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_NAME}
    ports:
      - "${PG_PORT}:${PG_PORT}"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  mongo-db:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - ./mongodb/mockData.js:/docker-entrypoint-initdb.d/mockData.js