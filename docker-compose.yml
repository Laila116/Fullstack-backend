services:
  frontend:
    build: 
      context: ../frontend
    ports:
      - "${PORT_FE}:${PORT_FE}"
    restart: always
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:      # Definiert Umgebungsvariablen für die Verbindung zur PostgreSQL- und MongoDB-Datenbank
      - PORT=${PORT}
      - DATABASE_HOST=postgresdb       # weil BE nicht im Docker
      - PG_USER=${PG_USER}         # Benutzername für PostgreSQL
      - PG_PASSWORD=${PG_PASSWORD} # Passwort für PostgreSQL
      - PG_NAME=${PG_NAME}       # Name der PostgreSQL-Datenbank
      - PG_PORT=${PG_PORT}    
      - MONGO_URI=${MONGO_DOCKER_URI}  # Verbindung zur MongoDB-Datenbank
      - MONGO_DB_NAME=${MONGO_DB_NAME}                      # Name der MongoDB-Datenbank
      - MONGO_PORT=${MONGO_PORT}
    depends_on: # stellt sciher das die vor Backend-Container gestartet werden
      - postgres-db
      - mongo-db
    restart: always
  postgres-db:
    image: postgres:15
    container_name: postgresdb
    environment: # Definiert Standardwerte für den PostgreSQL-Benutzer, das Passwort und die Datenbank
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_NAME}
    ports:
      - "${PG_PORT}:${PG_PORT}"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  mongo-db:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - ./mongodb/mockData.js:/docker-entrypoint-initdb.d/mockData.js
#volumes:
#  postgres_data:  # Definiert das Docker-Volume für PostgreSQL-Daten
#  mongo_data:     # Definiert das Docker-Volume für MongoDB-Daten